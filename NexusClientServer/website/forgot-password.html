<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NexusClient — Forgot Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/global-font.css">
  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="./css/footer.css">
  <link rel="icon" type="image/png" href="./img/logo.png" />
</head>

<body>
  <header>
    <div class="wrap">
      <nav>
        <a class="logo" href="./index.html">
          <img class="logo-mark" src="./img/logo.png" alt="NexusClient Logo" />
          <span>NexusClient</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <img src="./img/logo.png" alt="NexusClient" />
        </div>

        <h1>Forgot password?</h1>
        <p>Enter your e-mail and we'll send you a secure reset link.</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter your e-mail"
            autocomplete="email"
            required
          />
        </div>

        <div id="message" class="reset-message" hidden></div>

        <button class="btn btn-primary submit-btn" type="submit" id="reset-button">
          <span class="button-text">Send reset link</span>
          <span class="button-arrow">→</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="./login.html">← Back to login</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      © 2026 NexusClient
    </div>
  </footer>

  <script src="./js/forgot-password.js"></script>
</body>
</html>
