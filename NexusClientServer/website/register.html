<!doctype html>

<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusClient</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/global-font.css">
<link rel="icon" type="image/png" href="./img/logo.png" />
  <link rel="stylesheet" href="./css/register.css" />
  <link rel="stylesheet" href="./css/footer.css">
</head>

<body>
  <header>
    <div class="wrap">
      <nav>
    <a class="logo" href="./index.html">
      <img class="logo-mark" src="./img/logo.png" alt="NexusClient Logo"/>
      <span>NexusClient</span>
    </a>
  </nav>
</div>
  </header>
  <main class="auth-page">
<div class="auth-card">
  <div class="auth-header">
    <div class="auth-icon">
      <img src="./img/logo.png" alt="NexusClient" />
    </div>
    <h1>Create account</h1>
    <p>
      Create your NexusClient account to get started.
    </p>
  </div>
  <form action="/register" method="POST" id="register-form" novalidate >
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" name="username"type="text" placeholder="Enter your username" autocomplete="username" minlength="3" required />
    </div>
    <div class="form-group">
      <label for="email">E-Mail<span class="optional">Optional</span>
      </label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Create a strong password" autocomplete="new-password" minlength="6" required />
    </div>
    <div class="form-group">
      <label for="license">License Key</label>
      <input id="license" name="license" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" required />
    </div>
    <label class="terms">
      <input type="checkbox" id="terms" name="terms" required />
      <span class="terms-box"></span>
      <span class="terms-text"> I agree to the
       <a href="./terms.html">Terms of Service </a>and
       <a href="./privacy.html">Privacy Policy</a>.
      </span>
    </label>
    <button class="btn btn-primary submit-btn" type="submit" id="register-button" disabled>
      <span class="button-text">Create Account</span>
      <span class="button-arrow">→</span>
    </button>
  </form>
  <div class="auth-footer">
    <span>Already registered?</span>
    <a href="./login.html">Sign in</a>
  </div>
</div>
  </main>
  <footer>
    <div class="wrap">
      © 2026 NexusClient
    </div>
  </footer>
  <script src="./js/register.js"></script>
</body>
</html>
