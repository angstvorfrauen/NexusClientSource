<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusClient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/global-font.css">
  <link rel="icon" type="image/png" href="./img/logo.png" />
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="stylesheet" href="./css/footer.css">
  <style>
    .reset-message {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }
    .reset-message.success { display:block; }
    .reset-message.error { display:block; }
    .reset-message:empty { display:none; }
    .reset-back {
      display: inline-block;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a class="logo" href="./index.html">
          <img class="logo-mark" src="./img/logo.png" alt="NexusClient Logo" />
          <span>NexusClient</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <img src="./img/logo.png" alt="NexusClient" />
        </div>
        <h1>Reset password</h1>
        <p>Choose a new password for your NexusClient account.</p>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Enter your new password" required />
        </div>

        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Repeat your new password" required />
        </div>

        <div id="message" class="reset-message"></div>

        <button class="btn btn-primary submit-btn" type="submit" id="reset-button">
          <span class="button-text">Reset Password</span>
          <span class="button-arrow">→</span>
        </button>
      </form>

      <div class="auth-footer">
        <span>Remember your password?</span>
        <a class="reset-back" href="./login.html">Back to login</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      © 2026 NexusClient
    </div>
  </footer>

  <script src="./js/reset-password.js"></script>
</body>
</html>
